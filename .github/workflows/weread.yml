name: weread sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weread-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check required configuration
        shell: bash
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
        run: |
          missing=0
          for name in WEREAD_API_KEY NOTION_TOKEN NOTION_PAGE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Sync WeRead to Notion
        uses: malinkang/weread2notion@36daed3aa7fda67088f97fc23c03f63e418220c4
        with:
          weread-api-key: ${{ secrets.WEREAD_API_KEY }}
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-page: ${{ secrets.NOTION_PAGE }}
          python-version: "3.11"
